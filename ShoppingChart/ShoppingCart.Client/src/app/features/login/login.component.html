<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Sign In</mat-card-title>
      <mat-card-subtitle>Enter your credentials to continue</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="you@example.com">
          <mat-icon matPrefix>email</mat-icon>
          <div *ngIf="loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched">
            <mat-error>Email is required</mat-error>
          </div>
          <div *ngIf="loginForm.get('email')?.hasError('email') && loginForm.get('email')?.touched">
            <mat-error>Enter a valid email</mat-error>
          </div>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password"
                 [type]="hidePassword ? 'password' : 'text'"
                 placeholder="Minimum 8 characters">
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix type="button"
                  (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <div *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched">
            <mat-error>Password is required</mat-error>
          </div>
          <div *ngIf="loginForm.get('password')?.hasError('minlength') && loginForm.get('password')?.touched">
            <mat-error>Minimum 8 characters</mat-error>
          </div>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit"
                class="full-width login-btn"
                [disabled]="loginForm.invalid || loading">
          <ng-container *ngIf="loading; else loadedContent">
            <mat-spinner diameter="20"></mat-spinner>
          </ng-container>
          <ng-template #loadedContent>Sign In</ng-template>
        </button>

        <p class="register-link">
          Don't have an account? <a routerLink="/register">Register</a>
        </p>
      </form>
    </mat-card-content>
  </mat-card>
</div>
